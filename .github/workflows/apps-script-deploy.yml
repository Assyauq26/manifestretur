name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.github/workflows/apps-script-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync & deploy Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployment secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub secret: CLASPRC_JSON'; exit 1; }

      - name: Configure clasp authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          raw = os.environ["CLASPRC_JSON"].strip()
          data = json.loads(raw)
          pathlib.Path.home().joinpath(".clasprc.json").write_text(
              json.dumps(data, separators=(",", ":"), ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          chmod 600 "$HOME/.clasprc.json"

      - name: Install clasp
        run: npm install --global @google/clasp@latest

      - name: Verify Apps Script project
        run: |
          clasp --version
          test -f .clasp.json
          test -f apps-script/appsscript.json

          node <<'NODE'
          const fs = require('fs');
          const clasp = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('apps-script/appsscript.json', 'utf8'));

          if (!clasp.scriptId) throw new Error('.clasp.json is missing scriptId');
          if (clasp.rootDir !== 'apps-script') throw new Error('.clasp.json rootDir must be "apps-script"');
          if (!manifest.runtimeVersion) console.warn('Warning: appsscript.json has no runtimeVersion');

          console.log('clasp configuration and manifest are valid');
          NODE

      - name: Check Apps Script files
        run: |
          find apps-script -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate clasp credentials
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads((pathlib.Path.home() / ".clasprc.json").read_text(encoding="utf-8"))
          if "default" not in data.get("tokens", {}):
              raise SystemExit("CLASPRC_JSON does not contain tokens.default")
          print("CLASPRC_JSON parsed successfully")
          PY

      - name: Push source to Apps Script
        run: |
          clasp status
          clasp push --force --debug

      - name: Publish production deployment
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$SCRIPT_ID" || { echo 'Missing GitHub secret: APPS_SCRIPT_ID'; exit 1; }
          curl --fail-with-body -sS             -X POST             -H "Authorization: Bearer $(python3 - <<'PY'
          import json, pathlib
          d=json.loads((pathlib.Path.home()/'.clasprc.json').read_text())
          print(d['tokens']['default']['access_token'])
          PY
          )"             -H "Content-Type: application/json"             "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions"             -d '{"description":"GitHub Actions '"$GITHUB_SHA"'"}'

      - name: Deployment reminder
        if: failure()
        run: |
          echo "If source push succeeded but publishing failed, verify Apps Script API access and the APPS_SCRIPT_ID secret."
