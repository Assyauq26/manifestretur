name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.github/workflows/apps-script-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync & deploy Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate authentication secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub secret: CLASPRC_JSON'; exit 1; }

      - name: Configure clasp authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(os.environ["CLASPRC_JSON"].strip())
          pathlib.Path.home().joinpath(".clasprc.json").write_text(
              json.dumps(data, separators=(",", ":"), ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          chmod 600 "$HOME/.clasprc.json"

      - name: Install clasp
        run: npm install --global @google/clasp@latest

      - name: Verify Apps Script project
        run: |
          clasp --version
          test -f .clasp.json
          test -f apps-script/appsscript.json
          node <<'NODE'
          const fs = require('fs');
          const clasp = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('apps-script/appsscript.json', 'utf8'));
          if (!clasp.scriptId) throw new Error('.clasp.json is missing scriptId');
          if (!/^[A-Za-z0-9_-]+$/.test(clasp.scriptId)) throw new Error('Invalid .clasp.json scriptId');
          if (clasp.rootDir !== 'apps-script') throw new Error('.clasp.json rootDir must be "apps-script"');
          if (!manifest.runtimeVersion) console.warn('Warning: appsscript.json has no runtimeVersion');
          console.log('clasp configuration and manifest are valid');
          console.log('scriptId:', clasp.scriptId);
          NODE

      - name: Check Apps Script files
        run: |
          find apps-script -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate clasp credentials
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads((pathlib.Path.home() / ".clasprc.json").read_text(encoding="utf-8"))
          token = data.get("tokens", {}).get("default", {})
          if not token:
              raise SystemExit("CLASPRC_JSON does not contain tokens.default")
          if not token.get("refresh_token") and not token.get("access_token"):
              raise SystemExit("CLASPRC_JSON does not contain a usable token")
          print("CLASPRC_JSON parsed successfully")
          PY

      - name: Validate Apps Script web deployment target
        env:
          DEPLOYMENT_ID: AKfycbxzFZV3HMqdRf8_sFQFCZ3qQcIhnRVEXLhzTYGD7OPjv-Q7khAvMdCk8jx90Ff9d10WUw
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_ID"
          case "$DEPLOYMENT_ID" in
            AKfycb*) echo "Using configured production deployment: ${DEPLOYMENT_ID:0:18}..." ;;
            *) echo "Configured deployment ID does not look like an Apps Script deployment ID."; exit 1 ;;
          esac

      - name: Push source to Apps Script
        run: |
          set -euo pipefail
          clasp status
          clasp push --force

      - name: Create Apps Script version
        id: version
        run: |
          set -euo pipefail
          DESCRIPTION="Production ${GITHUB_SHA::7}"
          VERSION_OUTPUT="$(clasp version "$DESCRIPTION" 2>&1)"
          echo "$VERSION_OUTPUT"
          VERSION_NUMBER="$(printf '%s\n' "$VERSION_OUTPUT" | grep -oE 'Version [0-9]+' | tail -n 1 | awk '{print $2}' || true)"
          if [ -z "$VERSION_NUMBER" ]; then
            VERSION_NUMBER="$(clasp versions | tail -n 1 | awk 'NF && $1 ~ /^[0-9]+$/ {print $1}' || true)"
          fi
          if [ -z "$VERSION_NUMBER" ]; then
            echo "Unable to determine the Apps Script version number."
            exit 1
          fi
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION_NUMBER"

      - name: Publish production deployment
        env:
          DEPLOYMENT_ID: AKfycbxzFZV3HMqdRf8_sFQFCZ3qQcIhnRVEXLhzTYGD7OPjv-Q7khAvMdCk8jx90Ff9d10WUw
          VERSION_NUMBER: ${{ steps.version.outputs.version_number }}
        run: |
          set -euo pipefail
          echo "Updating configured production deployment to version $VERSION_NUMBER."
          clasp update-deployment "$DEPLOYMENT_ID" --versionNumber "$VERSION_NUMBER"
