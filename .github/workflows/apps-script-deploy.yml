name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.github/workflows/apps-script-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync & deploy Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate authentication secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub secret: CLASPRC_JSON'; exit 1; }

      - name: Configure clasp authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(os.environ["CLASPRC_JSON"].strip())
          pathlib.Path.home().joinpath(".clasprc.json").write_text(
              json.dumps(data, separators=(",", ":"), ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          chmod 600 "$HOME/.clasprc.json"

      - name: Install clasp
        run: npm install --global @google/clasp@latest

      - name: Verify Apps Script project
        run: |
          clasp --version
          test -f .clasp.json
          test -f apps-script/appsscript.json
          node <<'NODE'
          const fs = require('fs');
          const clasp = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('apps-script/appsscript.json', 'utf8'));
          if (!clasp.scriptId) throw new Error('.clasp.json is missing scriptId');
          if (clasp.rootDir !== 'apps-script') throw new Error('.clasp.json rootDir must be "apps-script"');
          if (!manifest.runtimeVersion) console.warn('Warning: appsscript.json has no runtimeVersion');
          console.log('clasp configuration and manifest are valid');
          NODE

      - name: Check Apps Script files
        run: |
          find apps-script -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Validate clasp credentials
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads((pathlib.Path.home() / ".clasprc.json").read_text(encoding="utf-8"))
          if "default" not in data.get("tokens", {}):
              raise SystemExit("CLASPRC_JSON does not contain tokens.default")
          print("CLASPRC_JSON parsed successfully")
          PY

      - name: Push source to Apps Script
        run: |
          set -euo pipefail
          clasp status
          clasp push --force

      - name: Create Apps Script version
        id: version
        run: |
          set -euo pipefail
          DESCRIPTION="Production ${GITHUB_SHA::7}"
          echo "Creating Apps Script version..."
          VERSION_OUTPUT="$(clasp version "$DESCRIPTION" 2>&1)"
          echo "$VERSION_OUTPUT"
          VERSION_NUMBER="$(printf '%s\n' "$VERSION_OUTPUT" | grep -oE 'Version [0-9]+' | tail -n 1 | awk '{print $2}' || true)"
          if [ -z "$VERSION_NUMBER" ]; then
            VERSION_NUMBER="$(clasp versions | tail -n 1 | awk 'NF {print $1}' || true)"
          fi
          if [ -z "$VERSION_NUMBER" ]; then
            echo "Unable to determine the Apps Script version number."
            exit 1
          fi
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION_NUMBER"

      - name: Check existing deployments
        run: |
          set -euo pipefail
          if ! deployments="$(clasp list-deployments 2>&1)"; then
            echo "Unable to list Apps Script deployments."
            echo "$deployments"
            exit 1
          fi
          echo "$deployments"

      - name: Publish production deployment
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version_number }}
        run: |
          set -euo pipefail
          deployments="$(clasp list-deployments 2>&1)"
          echo "$deployments"
          deployment_id="$(printf '%s\n' "$deployments" | grep -oE 'AKfycb[A-Za-z0-9_-]+' | head -n 1 || true)"

          if [ -n "$deployment_id" ]; then
            echo "Updating existing production deployment to version $VERSION_NUMBER."
            clasp update-deployment "$deployment_id" --versionNumber "$VERSION_NUMBER"
          else
            echo "No existing deployment found; creating a new production deployment."
            clasp deploy --versionNumber "$VERSION_NUMBER" --description "Production ${GITHUB_SHA::7}"
          fi
