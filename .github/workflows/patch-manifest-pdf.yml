name: Patch Manifest PDF Flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch requested changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          s = app.read_text()
          reps = [
            ("setSuccessData({ manifestNumber: result.data.manifestNumber, pdfUrl: result.data.pdfUrl });", "setSuccessData({ manifestNumber: result.data.manifestNumber, pdfUrl: result.data.pdfUrl, downloadUrl: result.data.downloadUrl || result.data.pdfUrl });"),
            ('<h2 className="text-2xl font-bold text-gray-900 mb-2">Berhasil!</h2>', '<h2 className="text-2xl font-bold text-gray-900 mb-2">Berhasil Manifest dibuat</h2>'),
            ("onClick={() => window.open(successData.pdfUrl, '_blank')} className=\"w-full py-4 rounded-xl bg-[#D71920] text-white font-bold shadow-md hover:bg-[#B9151B] transition-colors\">BUKA PDF SEKARANG</button>", "onClick={() => { window.location.href = successData.downloadUrl || successData.pdfUrl; }} className=\"w-full py-4 rounded-xl bg-[#D71920] text-white font-bold shadow-md hover:bg-[#B9151B] transition-colors\">DOWNLOAD MANIFEST</button>"),
            ('<>LANJUT PDF <ChevronLeft size={18} className="ml-1 rotate-180" /></>', '<>BUAT MANIFEST <ChevronLeft size={18} className="ml-1 rotate-180" /></>')
          ]
          for old, new in reps:
              if old not in s: raise SystemExit('App.jsx expected text not found: ' + old[:80])
              s = s.replace(old, new, 1)
          app.write_text(s)

          kode = Path('apps-script/Kode.gs')
          k = kode.read_text()
          if 'const totalRows = 40;' not in k: raise SystemExit('totalRows=40 not found')
          k = k.replace('const totalRows = 40;', 'const totalRows = 35;', 1)
          old_css = '''  .logo {
    position: absolute;
    top: -1mm;
    right: 7mm;
    color: #D71920;
    font-size: 15pt;
    font-weight: 900;
    font-style: italic;
    white-space: nowrap;
  }

  .logo small {
    font-size: 8pt;
    margin-left: 1mm;
  }
'''
          new_css = '''  .logo-image {
    position: absolute;
    top: -1mm;
    right: 7mm;
    width: 39mm;
    height: auto;
    display: block;
  }
'''
          if old_css not in k: raise SystemExit('logo CSS not found')
          k = k.replace(old_css, new_css, 1)
          old_html = '''    <div class="logo">
      J&amp;T<small>EXPRESS</small>
    </div>
'''
          new_html = '''    <img class="logo-image" src="${getJTLogoDataUri_()}" alt="J&T Express" />
'''
          if old_html not in k: raise SystemExit('logo HTML not found')
          k = k.replace(old_html, new_html, 1)
          helper = '''function getJTLogoDataUri_() {
  const logoUrl = 'https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/J%26T_Express_logo.svg';
  const response = UrlFetchApp.fetch(logoUrl, { muteHttpExceptions: true });
  if (response.getResponseCode() < 200 || response.getResponseCode() >= 300) {
    throw new Error('Gagal mengambil logo J&T Express dari Wikimedia Commons. HTTP ' + response.getResponseCode());
  }
  return 'data:image/svg+xml;base64,' + Utilities.base64Encode(response.getBlob().getBytes());
}

'''
          marker = 'function generatePdfDrive(\n  manifestNumber,'
          if 'function getJTLogoDataUri_()' not in k:
              if marker not in k: raise SystemExit('generatePdfDrive marker not found')
              k = k.replace(marker, helper + marker, 1)
          old_ret = """      manifestNumber: manifestNumber,
      pdfUrl: pdfResult.url,
      status: 'READY_HANDOVER'
"""
          new_ret = """      manifestNumber: manifestNumber,
      pdfUrl: pdfResult.url,
      downloadUrl: 'https://drive.google.com/uc?export=download&id=' + pdfResult.id,
      status: 'READY_HANDOVER'
"""
          if old_ret not in k: raise SystemExit('response block not found')
          k = k.replace(old_ret, new_ret, 1)
          kode.write_text(k)
          PY
      - name: Validate
        run: |
          grep -q 'const totalRows = 35;' apps-script/Kode.gs
          grep -q 'Berhasil Manifest dibuat' src/App.jsx
          grep -q 'DOWNLOAD MANIFEST' src/App.jsx
          grep -q 'BUAT MANIFEST' src/App.jsx
          grep -q 'downloadUrl' apps-script/Kode.gs
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx apps-script/Kode.gs
          git rm .github/workflows/patch-manifest-pdf.yml PATCH_TRIGGER.md
          git commit -m 'feat: update manifest PDF template and generate flow'
          git push
