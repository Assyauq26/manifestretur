name: Integrate Handover V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'integrate handover v2') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch App route
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          import_line = "import HandoverPageV2 from './HandoverPage.jsx';\n"
          if import_line not in text:
              marker = "import { Eye, EyeOff, Loader2, ChevronLeft, Calendar, User as UserIcon, MapPin, Camera, Type, Trash2, Save, AlertCircle, Home, FileText, CheckSquare, Clock } from 'lucide-react';\n"
              if marker not in text:
                  raise SystemExit('Lucide import marker not found')
              text = text.replace(marker, marker + import_line, 1)

          old_route = '<Route path="/handover" element={<ProtectedRoute><HandoverPage /></ProtectedRoute>} />'
          new_route = '<Route path="/handover" element={<ProtectedRoute><HandoverPageV2 /></ProtectedRoute>} />'
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          elif new_route not in text:
              raise SystemExit('Handover route not found')

          path.write_text(text, encoding='utf-8')

      - name: Build validation
        run: |
          npm ci
          npm run build

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-handover-v2.yml
          git add src/App.jsx src/HandoverPage.jsx
          git commit -m "feat: integrate handover v2 [integrate handover v2]"
          git push
